# config.yaml    Every number that might need tuning lives here. Never hard-code a threshold.
# Aadharsh keeps this file. Each person edits ONLY their own sections (owner in brackets).
# Core reloads this file automatically about once a second when it changes on disk.

# ---------- [Aadharsh] core ----------
camera:   {index: 0, width: 640, height: 480, fps: 30, mirror: true, reopen_after_fails: 30}
# rest_tilt_deg: a hand hanging with its fingers toward the floor is resting: it starts no fist, swipe or Search.
hands:    {max_hands: 3, det_conf: 0.5, track_conf: 0.5, presence_conf: 0.5, swap_sides: true,
           model: models/hand_landmarker.task, scale_ema: 0.3, infer_width: 640, rest_tilt_deg: 120, rest_ms: 150}
poses:    {extend_deg: 155, curl_deg: 125, debounce_frames: 3, window: 5,
           thumb_deg: 150, thumb_tip_scales: 0.6, unknown_min_score: 0.6, palm_sign: 1,
           pinky_extend_deg: 135, pinky_curl_deg: 125, open_needs_thumb: false}
tracker:  {max_jump_scales: 4.0, dropout_ms: 450}   # 450: a hand blurred out mid-swipe keeps its id
pointer:  {box: [0.25, 0.20, 0.75, 0.65], min_cutoff: 1.0, beta: 0.02, hide_after_ms: 500,
           show_frames: 3, park: [0.995, 0.995], deadband: 0.002}   # deadband: a resting hand holds the pointer still
# click_max_ms: a pinch let go within this is a click (tap_max_ms is only when the pen may start).
# Where ink is on, a pinch made while pointing stays a click until the hand moves pen_start_travel_scales.
pinch:    {down: 0.25, up: 0.40, prefreeze: 0.50, tap_max_ms: 300, post_freeze_ms: 80,
           click_max_ms: 900, pen_start_travel_scales: 0.25, fist_grace_ms: 250,
           open_before_ms: 150, pen_open_before_ms: 60,   # a pinch must start from a clear opening
           tap_needs_pointer: true}   # a pinch with no pointer only counts over the writing preview
pen:      {min_cutoff: 1.5, beta: 0.02, ink_default: false}   # ink_default: pen works before Rohan publishes ContextState
# two_*: two-finger swipes are gentler than open-hand ones. bridge_*: a swipe so fast the hand blurs out
# and comes back to the side still counts (bridge_max_ms: 0 turns that off).
swipe:    {natural: true, min_travel_scales: 1.4, max_ms: 800, min_peak_speed: 4.0, max_slope: 0.8,
           open_ratio: 0.5, settle_speed: 2.0, busy_speed: 3.0, refractory_ms: 800, opposite_block_ms: 1300,
           two_min_travel_scales: 1.2, two_min_peak_speed: 3.0, bridge_min_ms: 120, bridge_max_ms: 450}
level:    {mode: knob, knob_gain: 1.0, knob_dead_deg: 10, knob_min_step: 1.0, knob_invert: false,
           knob_max_step_deg: 60, idle_park_ms: 2500, knob_reverse_step: 4,   # reverse: turning back needs 4 points   # idle_park_ms: a grabbed, unturned knob stops locking out the other hand
           knob_min_cutoff: 1.0, knob_beta: 0.05, engage_ms: 400, tick_ms: 100, release_ms: 350,
           dead_zone_scales: 0.4, min_rate: 10, max_rate: 60, gain: 40}   # mode: vertical = old up/down
# fist_tap_slow_max_ms: a fist held this long without turning the knob, then opened, is still play/pause.
# palm_min_width: Search needs the palm shown flat (an edge-on open hand never opens it; 0 = off).
holds:    {palm_ms: 800, palm_max_speed: 1.0, still_window_ms: 300, grace_ms: 250, after_swipe_ms: 1200,
           both_palms_ms: 1000, palm_min_width: 0.45, fist_tap_min_ms: 80,
           fist_tap_max_ms: 400, fist_tap_max_travel: 0.4, fist_tap_slow_max_ms: 2500, after_pinch_ms: 400,
           palm_max_tilt_deg: 75, after_release_ms: 1500,   # Search: palm held up; not from the hand that just let go of a fist or pinch
           custom_ms: 500, custom_agree: 0.7}

# ---------- [Ryan] presence and access ----------
# Looking away pauses only on a clear head turn (yaw_deg, pitch_deg) held for away_ms. A hand passing
# over the face is ignored for face_lost_hold_ms. mode: off turns the whole owner lock off.
presence: {fps: 10, mode: lenient, yaw_deg: 40, pitch_deg: 35, away_ms: 1200, back_ms: 200,
           attach_ratio: 0.5, owner_lost_ms: 3000, max_people: 3,
           face_lost_hold_ms: 1200, baseline_samples: 10, reid_ms: 2000}
access:   {gesture: handshake, wrist_ratio: 0.35, hold_ms: 800, guest_timeout_s: 90,
           guest_lost_ms: 2000}

# ---------- [Rohan] writing, AI and memory ----------
write:    {pause_ms: 1500, idle_cancel_ms: 6000, image_long_side: 1024, stroke_px: 6}
llm:      {provider: anthropic, model: claude-haiku-5-5, timeout_s: 4, max_tokens: 60}   # provider: anthropic or bedrock
memory:   {provider: supermemory, enabled: true, user: owner, timeout_s: 2}   # key: SUPERMEMORY_API_KEY in .env, never here

# ---------- [Aadharsh] AWS ----------
# Credentials come from the environment or ~/.aws (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY). Never put keys here.
aws:      {region: us-west-2, bedrock_model_id: "", timeout_s: 4}

# ---------- [Swayam] ui and custom gestures ----------
custom:   {samples: 30, default_threshold: 0.16, margin: 0.03}
ui:       {hud_corner: bottom_right, hud_size: [420, 315], show_video: false}
