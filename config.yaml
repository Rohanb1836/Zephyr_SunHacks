# config.yaml    Every number that might need tuning lives here. Never hard-code a threshold.
# Aadharsh keeps this file. Each person edits ONLY their own sections (owner in brackets).
# Core reloads this file automatically about once a second when it changes on disk.

# ---------- [Aadharsh] core ----------
camera:   {index: 0, width: 640, height: 480, fps: 30, mirror: true, reopen_after_fails: 30,
           backend: auto}   # auto | msmf | dshow | avfoundation. Windows auto = MSMF (30 fps), then DirectShow
hands:    {max_hands: 3, det_conf: 0.6, track_conf: 0.6, presence_conf: 0.5, swap_sides: true,
           model: models/hand_landmarker.task, scale_ema: 0.3, infer_width: 640}
poses:    {extend_deg: 155, curl_deg: 125, debounce_frames: 3, window: 5,
           thumb_deg: 150, thumb_tip_scales: 0.6, unknown_min_score: 0.6, palm_sign: 1,
           pinky_extend_deg: 135, pinky_curl_deg: 125, open_needs_thumb: false}
tracker:  {max_jump_scales: 4.0, dropout_ms: 450}   # keeps a hand's id through a blurred swipe
pointer:  {box: [0.25, 0.20, 0.75, 0.65], min_cutoff: 1.0, beta: 0.02, hide_after_ms: 300,
           show_frames: 3, park: [0.995, 0.995]}
pinch:    {down: 0.25, up: 0.40, prefreeze: 0.50, tap_max_ms: 300, post_freeze_ms: 80,
           open_before_ms: 150, pen_open_before_ms: 60}   # a pinch must start from thumb and index clearly apart this long
pen:      {min_cutoff: 1.5, beta: 0.02, ink_default: false}   # ink_default: pen works before Rohan publishes ContextState
swipe:    {natural: true, min_travel_scales: 1.5, max_ms: 800, min_peak_speed: 5.0, max_slope: 0.7,
           open_ratio: 0.5, settle_speed: 2.0, busy_speed: 3.0, refractory_ms: 500, opposite_block_ms: 900,
           bridge_min_ms: 120, bridge_max_ms: 450}   # bridge: a swipe the tracker lost to motion blur
level:    {mode: knob, knob_gain: 1.0, knob_dead_deg: 8, knob_min_step: 1.0, knob_invert: false,
           knob_min_cutoff: 1.0, knob_beta: 0.05, engage_ms: 400, tick_ms: 100, release_ms: 250,
           dead_zone_scales: 0.4, min_rate: 10, max_rate: 60, gain: 40}   # mode: vertical = old up/down
holds:    {palm_ms: 800, palm_max_speed: 0.8, still_window_ms: 300, grace_ms: 150, after_swipe_ms: 1200,
            both_palms_ms: 1000, fist_tap_min_ms: 80,
           fist_tap_max_ms: 350, fist_tap_max_travel: 0.3, custom_ms: 500, custom_agree: 0.8}

# ---------- [Ryan] presence and access ----------
presence: {fps: 10, mode: lenient, yaw_deg: 25, pitch_deg: 28, away_ms: 400, back_ms: 200,
           attach_ratio: 0.5, owner_lost_ms: 2000, max_people: 3,
           reach_ratio: 2.5, reid_ms: 1500,      # reach: wrist to nose, in shoulder widths
           face_lost_hold_ms: 1200, baseline_samples: 10}   # face hidden by a hand is not looking away
access:   {gesture: handshake, wrist_ratio: 0.35, hold_ms: 800, guest_timeout_s: 90,
           guest_lost_ms: 2000}

# ---------- [Rohan] writing, AI and memory ----------
write:    {pause_ms: 1500, idle_cancel_ms: 6000, image_long_side: 1024, stroke_px: 6}
llm:      {provider: anthropic, model: claude-haiku-5-5, timeout_s: 4, max_tokens: 60}   # provider: anthropic or bedrock
memory:   {provider: supermemory, enabled: true, user: owner, timeout_s: 2}   # key: SUPERMEMORY_API_KEY in .env, never here

# ---------- [Aadharsh] AWS ----------
# Credentials come from the environment or ~/.aws (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY). Never put keys here.
aws:      {region: us-west-2, bedrock_model_id: "", timeout_s: 4}

# ---------- [Swayam] ui and custom gestures ----------
custom:   {samples: 30, default_threshold: 0.16, margin: 0.03}
ui:       {hud_corner: bottom_right, hud_size: [420, 315], show_video: false}
